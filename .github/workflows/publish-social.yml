name: Publish Social Queue

on:
  workflow_dispatch:
  schedule:
    # 09:00 AM IST daily
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: social-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Publish due post to Instagram and Facebook
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841424749134562' }}
          EXPECTED_INSTAGRAM_USERNAME: ${{ vars.BRAND_HANDLE || 'buildkarbro' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1392360773951187' }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || 'buildkarbro' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'Build Kar Bro' }}
        run: npm run publish

      - name: Commit publish status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --cached --quiet; then
            echo "No publish status changes to commit."
          else
            git commit -m "Save social publish status"
            git push
          fi
