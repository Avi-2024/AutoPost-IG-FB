name: Publish Social Queue

on:
  workflow_dispatch:
  schedule:
    # 09:00 AM IST daily
    - cron: "30,40,50 3 * * *" # 09:00, 09:10, 09:20 IST
    - cron: "0,30 4 * * *" # 09:30, 10:00 IST retries

permissions:
  contents: write

concurrency:
  group: aaj-se-better-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check account isolation and queue recovery
        run: npm test

      - name: Publish due post to Instagram and Facebook
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          EXPECTED_INSTAGRAM_USERNAME: ${{ vars.BRAND_HANDLE || 'aajsebetter' }}
          EXPECTED_FACEBOOK_PAGE_NAME: ${{ vars.FACEBOOK_PAGE_NAME || 'Aaj Se Better' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || 'NOT_CONFIGURED' }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || 'aajsebetter' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'Aaj Se Better' }}
        run: npm run publish

      - name: Commit publish status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --cached --quiet; then
            echo "No publish status changes to commit."
          else
            git commit -m "Save social publish status"
            git pull --rebase origin main
            git push
          fi

