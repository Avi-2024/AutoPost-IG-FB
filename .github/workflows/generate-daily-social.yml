name: Prepare Approved Daily Carousel

on:
  workflow_dispatch:
    inputs:
      post_date:
        description: "Optional IST date to verify"
        required: false
        type: string
  schedule:
    - cron: "0,10,20 2 * * *" # 07:30, 07:40, 07:50 IST readiness checks

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify today's original images and queue
        env:
          POST_DATE: ${{ inputs.post_date }}
        run: npm run generate
